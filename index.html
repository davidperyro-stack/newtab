<html>
    <head>
        <title>New Tab</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main>
            <p id="greeting">Good evening!</p>

            <h1 id="clock">00:00</h1>

            <p>Your new tab</p>

            <section class="focus-card">
                <span class="card-label">TODAYS FOCUS</span>

                <h2>What do you want to accomplish?</h2>

                <p class="focus-description">
                    Choose one thing and make it count.
                </p>

                <div class="focus-input">
                    <input
                        id="focusInput"
                        type="text"
                        placeholder="Enter your focus..."
                    >

                    <button id="focusButton" type="button">
                        Set Focus
                    </button>
                </div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
